# Upstream backend server
upstream backend_server {
    server backend:8080;
    keepalive 32;
}

# Upstream MinIO server
upstream minio_server {
    server minio:9000;
    keepalive 32;
}

# Redirect HTTP to HTTPS
server {
    listen 80;
    server_name travel-social-network.duckdns.org;

    # Let's Encrypt certificate verification
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # Redirect all other HTTP requests to HTTPS
    location / {
        return 301 https://$host$request_uri;
    }
}

# HTTPS server
server {
    listen 443 ssl;
    http2 on;
    server_name travel-social-network.duckdns.org;

    # SSL Configuration - Let's Encrypt
    ssl_certificate /etc/letsencrypt/live/travel-social-network.duckdns.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/travel-social-network.duckdns.org/privkey.pem;
    
    # SSL Security Settings
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    # Max body size for file uploads (200MB)
    client_max_body_size 200M;

    # Connection limit per IP
    limit_conn conn_limit 20;

    # MinIO storage proxy - for serving uploaded files
    location ~ ^/(users|posts|watches|groups|images)/ {
        proxy_pass http://minio_server;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        
        # Cache static files
        proxy_cache_valid 200 1d;
        expires 1d;
        add_header Cache-Control "public, immutable";
    }

    # Health check endpoint (no rate limit)
    location /actuator/health {
        proxy_pass http://backend_server;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
    }

    # Auth endpoints - Strict rate limiting (5 req/min)
    location ~ ^/api/v2/auth/ {
        limit_req zone=auth_limit burst=3 nodelay;
        
        proxy_pass http://backend_server;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        
        # Timeouts
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }

    # Upload endpoints - Medium rate limiting (2 req/sec)
    location ~ ^/api/v2/(posts|watches|groups|users)/.*/(upload|media|avatar|cover) {
        limit_req zone=upload_limit burst=5 nodelay;
        
        proxy_pass http://backend_server;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        
        # Longer timeout for uploads
        proxy_connect_timeout 120s;
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;
    }

    # Search/Heavy endpoints - Moderate rate limiting (5 req/sec)
    location ~ ^/api/v2/(search|newsfeed|explore|trending) {
        limit_req zone=search_limit burst=10 nodelay;
        
        proxy_pass http://backend_server;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }

    # WebSocket endpoint for real-time features
    location /ws {
        proxy_pass http://backend_server;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        # WebSocket timeout
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # General API endpoints - Standard rate limiting (10 req/sec)
    location /api/v2/ {
        limit_req zone=api_limit burst=20 nodelay;
        
        proxy_pass http://backend_server;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        
        # Timeouts
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }

    # Swagger UI (development only - consider removing in production)
    location /swagger-ui/ {
        limit_req zone=api_limit burst=10 nodelay;
        
        proxy_pass http://backend_server;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
    }

    # API Docs
    location /v3/api-docs {
        limit_req zone=api_limit burst=10 nodelay;
        
        proxy_pass http://backend_server;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
    }

    # Error pages
    error_page 429 /429.html;
    location = /429.html {
        default_type application/json;
        return 429 '{"success":false,"message":"Too Many Requests. Please slow down.","path":"$request_uri","timestamp":"$time_iso8601"}';
    }

    error_page 502 503 504 /50x.html;
    location = /50x.html {
        default_type application/json;
        return 503 '{"success":false,"message":"Service temporarily unavailable. Please try again later.","path":"$request_uri","timestamp":"$time_iso8601"}';
    }
}
