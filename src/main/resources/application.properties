spring.application.name=${APP_NAME:travel_social_network_server}

# setting database config
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=${DB_DRIVER}

#hibernate setting
spring.jpa.database-platform=${DB_PLATFORM}
spring.jpa.show-sql=${JPA_SHOW_SQL:true}
spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:validate}

#flyway
spring.flyway.enabled=${FLYWAY_ENABLED:true}
spring.flyway.baseline-on-migrate=${FLYWAY_BASELINE_ON_MIGRATE:true}
spring.flyway.locations=${FLYWAY_LOCATIONS:classpath:db/migration}
spring.flyway.validate-on-migrate=${FLYWAY_VALIDATE_ON_MIGRATE:true}

#prefix
api.base-url=${API_BASE_URL:/api/v2}
api.client.url=${API_CLIENT_URL:http://localhost:5173}

#jwt
jwt.secret.key=${JWT_SECRET}
jwt.expiration-seconds=${JWT_EXPIRATION_SECONDS:3600}

#cloudinary
cloudinary.name=${CLOUDINARY_NAME}
cloudinary.api.key=${CLOUDINARY_API_KEY}
cloudinary.api.secret=${CLOUDINARY_API_SECRET}

#minio
minio.endpoint=${MINIO_ENDPOINT:http://localhost:9000}
minio.public-url=${MINIO_PUBLIC_URL:}
minio.access-key=${MINIO_ACCESS_KEY:minioadmin}
minio.secret-key=${MINIO_SECRET_KEY:minioadmin}
minio.bucket-name=${MINIO_BUCKET_NAME:images}

# MinIO Buckets for different content types
minio.bucket.watches=${MINIO_BUCKET_WATCHES:watches}
minio.bucket.posts=${MINIO_BUCKET_POSTS:posts}
minio.bucket.groups=${MINIO_BUCKET_GROUPS:groups}
minio.bucket.users=${MINIO_BUCKET_USERS:users}

#setting file upload
spring.servlet.multipart.max-file-size=${MAX_FILE_SIZE:200MB}
spring.servlet.multipart.max-request-size=${MAX_REQUEST_SIZE:200MB}

# Actuator endpoints
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always
management.health.defaults.enabled=true

# Logging - use INFO for production, DEBUG/TRACE for development
logging.level.org.springdoc=${LOG_LEVEL_SPRINGDOC:WARN}
logging.level.org.springframework.web=${LOG_LEVEL_SPRING_WEB:INFO}

#mail
spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.auth=true

#oauth2 google
spring.security.oauth2.client.registration.google.client-id=${GOOGLE_CLIENT_ID}
spring.security.oauth2.client.registration.google.client-secret=${GOOGLE_CLIENT_SECRET}
spring.security.oauth2.client.registration.google.scope=email,profile
spring.security.oauth2.client.registration.google.redirect-uri={baseUrl}/oauth2/callback/google
spring.security.oauth2.client.provider.google.user-info-uri=https://www.googleapis.com/oauth2/v3/userinfo

#google oauth api
google.oauth.userinfo.url=${GOOGLE_OAUTH_USERINFO_URL:https://www.googleapis.com/oauth2/v2/userinfo}

#facebook oauth api
facebook.oauth.app-id=${FACEBOOK_APP_ID}
facebook.oauth.app-secret=${FACEBOOK_APP_SECRET}
facebook.oauth.userinfo.url=${FACEBOOK_OAUTH_USERINFO_URL:https://graph.facebook.com/v18.0/me?fields=id,name,email,picture}

#google studio api
google.studio.api.key=${GOOGLE_STUDIO_API_KEY}
google.studio.project.id=${GOOGLE_STUDIO_PROJECT_ID}
google.studio.project.name=${GOOGLE_STUDIO_PROJECT_NAME}
google.studio.model=${GOOGLE_STUDIO_MODEL}
google.studio.endpoint=${GOOGLE_STUDIO_ENDPOINT}

#redis
spring.cache.type=redis
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}
spring.cache.redis.time-to-live=${REDIS_TTL:3600000}

#mongodb - MongoDB Atlas Configuration
spring.data.mongodb.uri=${MONGODB_URI}
spring.data.mongodb.database=${MONGODB_DATABASE}
spring.data.mongodb.auto-index-creation=${MONGODB_AUTO_INDEX:true}

# MongoDB Logging (for debugging)
logging.level.org.springframework.data.mongodb.core.MongoTemplate=${LOG_LEVEL_MONGO:INFO}
logging.level.org.springframework.data.mongodb.repository=${LOG_LEVEL_MONGO:INFO}

# Security Logging - use INFO for production
logging.level.org.springframework.security=${LOG_LEVEL_SPRING_SECURITY:INFO}

# Jackson Configuration
spring.jackson.serialization.write-dates-as-timestamps=false
spring.jackson.time-zone=UTC


