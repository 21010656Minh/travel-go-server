# Test configuration
spring.application.name=travel_social_network_server

# Database configuration for testing (H2)
spring.datasource.url=${TEST_DB_URL:jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE}
spring.datasource.driver-class-name=${TEST_DB_DRIVER:org.h2.Driver}
spring.datasource.username=${TEST_DB_USERNAME:sa}
spring.datasource.password=${TEST_DB_PASSWORD:}

# JPA configuration for testing
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect

# API configuration
api.base-url=${TEST_API_BASE_URL:/api/v2}
api.client.url=${TEST_API_CLIENT_URL:http://localhost:3000}

# JWT configuration for testing
jwt.secret.key=${TEST_JWT_SECRET:test-secret-key-for-testing-only}
jwt.expiration-seconds=${TEST_JWT_EXPIRATION_SECONDS:3600}

# OAuth2 configuration for testing
spring.security.oauth2.client.registration.google.client-id=${TEST_GOOGLE_CLIENT_ID:test-google-client-id}
spring.security.oauth2.client.registration.google.client-secret=${TEST_GOOGLE_CLIENT_SECRET:test-google-client-secret}
spring.security.oauth2.client.registration.facebook.client-id=${TEST_FACEBOOK_CLIENT_ID:test-facebook-client-id}
spring.security.oauth2.client.registration.facebook.client-secret=${TEST_FACEBOOK_CLIENT_SECRET:test-facebook-client-secret}

# Mail configuration for testing
spring.mail.host=${TEST_MAIL_HOST:localhost}
spring.mail.port=${TEST_MAIL_PORT:587}
spring.mail.username=${TEST_MAIL_USERNAME:test@example.com}
spring.mail.password=${TEST_MAIL_PASSWORD:test}

# Disable external services for testing
spring.cache.type=none
spring.flyway.enabled=false

# Logging
logging.level.org.springframework.web=${TEST_LOG_LEVEL_SPRING_WEB:DEBUG}
logging.level.org.hibernate.SQL=${TEST_LOG_LEVEL_HIBERNATE_SQL:DEBUG}
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=${TEST_LOG_LEVEL_HIBERNATE_BINDER:TRACE}
logging.level.org.springframework.security=${TEST_LOG_LEVEL_SPRING_SECURITY:DEBUG}
